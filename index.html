<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мінімалістичний календар</title>
<style>
    :root {
        --bg-body: #f5f5f7;
        --bg-calendar: #ffffff;
        --border-calendar: #e8e8eb;
        --border-divider: #ededee;
        --text-primary: #18181b;
        --text-secondary: #52525b;
        --text-muted: #a1a1aa;
        --btn-bg: #f4f4f5;
        --btn-bg-hover: #e9e9ec;
        --day-hover: #f1f1f3;
        --today-ring: #d4d4d8;
        --selected-fill-bg: #18181b;
        --selected-fill-text: #ffffff;
        --selected-fill-hover: #27272a;
        --selected-circle-border: #18181b;
        --shadow: rgba(0, 0, 0, 0.07);
        --pill-active-bg: #ffffff;
        --pill-active-text: #18181b;
    }

    /* Стилі темної теми */
    body.dark-theme {
        --bg-body: #121214;
        --bg-calendar: #1c1c1f;
        --border-calendar: #2e2e33;
        --border-divider: #27272a;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --btn-bg: #27272a;
        --btn-bg-hover: #323236;
        --day-hover: #2a2a2e;
        --today-ring: #52525b;
        --selected-fill-bg: #f4f4f5;
        --selected-fill-text: #18181b;
        --selected-fill-hover: #e4e4e7;
        --selected-circle-border: #f4f4f5;
        --shadow: rgba(0, 0, 0, 0.4);
        --pill-active-bg: #323236;
        --pill-active-text: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg-body);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text-primary);
        transition: background .2s ease, color .2s ease;
    }

    /* Кнопка перемикання теми */
    .theme-toggle-wrapper {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
    }

    .theme-toggle-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--bg-calendar);
        border: 1px solid var(--border-calendar);
        color: var(--text-primary);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 4px 14px var(--shadow);
        transition: transform .15s ease, background .2s ease;
        font-size: 19px;
    }

    .theme-toggle-btn:hover {
        transform: scale(1.06);
    }

    @media print {
        .theme-toggle-wrapper {
            display: none !important;
        }
    }

    .calendar {
        width: min(100%, 460px);
        background: var(--bg-calendar);
        border: 1px solid var(--border-calendar);
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 16px 45px var(--shadow);
        transition: background .2s ease, border-color .2s ease;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 16px; /* Додатковий простір між заголовком та кнопками */
    }

    .month-title {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.03em;
        white-space: nowrap;
        margin-right: 8px; /* Гарантована відстань праворуч від тексту */
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .style-picker {
        display: flex;
        background: var(--btn-bg);
        border-radius: 12px;
        padding: 3px;
        gap: 2px;
    }

    .style-btn {
        border: 0;
        background: transparent;
        border-radius: 9px;
        padding: 6px 11px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all .15s ease;
    }

    .style-btn .preview-icon {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
    }

    .style-btn.fill-btn .preview-icon {
        background: currentColor;
    }

    .style-btn.outline-btn .preview-icon {
        border: 2px solid currentColor;
    }

    .style-btn.active {
        background: var(--pill-active-bg);
        color: var(--pill-active-text);
        box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    .navigation {
        display: flex;
        gap: 6px;
    }

    .nav-btn {
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 12px;
        background: var(--btn-bg);
        color: var(--text-primary);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: .15s ease;
    }

    .nav-btn:hover {
        background: var(--btn-bg-hover);
        transform: translateY(-1px);
    }

    .weekdays,
    .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        width: 100%;
    }

    .weekdays {
        margin-bottom: 8px;
    }

    .weekday {
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .days {
        row-gap: 7px;
    }

    .day-cell {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .day {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 450;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease, box-shadow .15s ease, color .15s ease, transform .12s ease;
    }

    .day:hover {
        background: var(--day-hover);
    }

    .day:active {
        transform: scale(.93);
    }

    .day.today {
        font-weight: 700;
        box-shadow: inset 0 0 0 1.5px var(--today-ring);
    }

    /* Стиль: Круг */
    .calendar.style-fill .day.selected {
        background: var(--selected-fill-bg);
        color: var(--selected-fill-text);
        box-shadow: none;
        font-weight: 600;
    }

    .calendar.style-fill .day.selected:hover {
        background: var(--selected-fill-hover);
    }

    /* Стиль: Коло */
    .calendar.style-circle .day.selected {
        background: transparent;
        color: var(--text-primary);
        box-shadow: inset 0 0 0 2px var(--selected-circle-border);
        font-weight: 600;
    }

    .calendar.style-circle .day.selected:hover {
        background: var(--day-hover);
    }

    .footer {
        margin-top: 24px;
        padding-top: 17px;
        border-top: 1px solid var(--border-divider);
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--text-muted);
        font-size: 13px;
    }

    .clear {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        cursor: pointer;
        padding: 7px 9px;
        border-radius: 8px;
    }

    .clear:hover {
        background: var(--btn-bg);
    }

    @media (max-width: 440px) {
        body { padding: 14px; }

        .theme-toggle-wrapper {
            top: 12px;
            right: 12px;
        }

        .calendar {
            padding: 22px 16px;
            border-radius: 24px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .header-actions {
            width: 100%;
            justify-content: space-between;
        }

        .month-title {
            font-size: 20px;
            margin-right: 0;
        }

        .day-cell {
            height: 44px;
        }

        .day {
            width: 39px;
            height: 39px;
        }
    }
</style>
</head>

<body>

<div class="theme-toggle-wrapper">
    <button class="theme-toggle-btn" id="themeToggle" title="Змінити тему" aria-label="Змінити тему">🌙</button>
</div>

<div class="calendar style-fill" id="calendar">
    <div class="header">
        <div class="month-title" id="monthTitle"></div>

        <div class="header-actions">
            <div class="style-picker" role="radiogroup" aria-label="Формат вибору">
                <button class="style-btn fill-btn active" data-style="fill" type="button" aria-checked="true" role="radio">
                    <span class="preview-icon"></span> Круг
                </button>
                <button class="style-btn outline-btn" data-style="circle" type="button" aria-checked="false" role="radio">
                    <span class="preview-icon"></span> Коло
                </button>
            </div>

            <div class="navigation">
                <button class="nav-btn" id="prev" aria-label="Попередній місяць">‹</button>
                <button class="nav-btn" id="next" aria-label="Наступний місяць">›</button>
            </div>
        </div>
    </div>

    <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Нд</div>
    </div>

    <div class="days" id="days"></div>

    <div class="footer">
        <span id="selectedCount">Нічого не вибрано</span>
        <button class="clear" id="clear">Очистити</button>
    </div>
</div>

<script>
(() => {
    const monthNames = [
        "Січень", "Лютий", "Березень", "Квітень",
        "Травень", "Червень", "Липень", "Серпень",
        "Вересень", "Жовтень", "Листопад", "Грудень"
    ];

    const today = new Date();
    let year = today.getFullYear();
    let month = today.getMonth();

    const selectedDays = new Set();

    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");
    const daysContainer = document.getElementById("days");
    const selectedCount = document.getElementById("selectedCount");
    const styleButtons = document.querySelectorAll(".style-btn");
    const themeToggleBtn = document.getElementById("themeToggle");

    const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    let isDark = systemPrefersDark;

    function applyTheme(dark) {
        isDark = dark;
        if (isDark) {
            document.body.classList.add("dark-theme");
            themeToggleBtn.textContent = "☀️";
        } else {
            document.body.classList.remove("dark-theme");
            themeToggleBtn.textContent = "🌙";
        }
    }

    applyTheme(systemPrefersDark);

    themeToggleBtn.addEventListener("click", () => {
        applyTheme(!isDark);
    });

    function dateKey(y, m, d) {
        return `${y}-${m}-${d}`;
    }

    styleButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            const style = btn.dataset.style;
            
            styleButtons.forEach(b => {
                b.classList.remove("active");
                b.setAttribute("aria-checked", "false");
            });

            btn.classList.add("active");
            btn.setAttribute("aria-checked", "true");

            if (style === "circle") {
                calendar.classList.remove("style-fill");
                calendar.classList.add("style-circle");
            } else {
                calendar.classList.remove("style-circle");
                calendar.classList.add("style-fill");
            }
        });
    });

    function render() {
        monthTitle.textContent = `${monthNames[month]} ${year}`;
        daysContainer.innerHTML = "";

        const firstDay = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const offset = (firstDay.getDay() + 6) % 7;

        for (let i = 0; i < offset; i++) {
            const cell = document.createElement("div");
            cell.className = "day-cell";
            daysContainer.appendChild(cell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement("div");
            cell.className = "day-cell";

            const button = document.createElement("button");
            button.className = "day";
            button.textContent = day;
            button.type = "button";

            const key = dateKey(year, month, day);

            if (
                year === today.getFullYear() &&
                month === today.getMonth() &&
                day === today.getDate()
            ) {
                button.classList.add("today");
            }

            if (selectedDays.has(key)) {
                button.classList.add("selected");
            }

            button.addEventListener("click", () => {
                if (selectedDays.has(key)) {
                    selectedDays.delete(key);
                    button.classList.remove("selected");
                } else {
                    selectedDays.add(key);
                    button.classList.add("selected");
                }

                updateCount();
            });

            cell.appendChild(button);
            daysContainer.appendChild(cell);
        }

        updateCount();
    }

    function updateCount() {
        const count = selectedDays.size;

        if (count === 0) {
            selectedCount.textContent = "Нічого не вибрано";
        } else {
            selectedCount.textContent =
                `${count} ${count === 1 ? "день" : "днів"} вибрано`;
        }
    }

    document.getElementById("prev").addEventListener("click", () => {
        month--;
        if (month < 0) {
            month = 11;
            year--;
        }
        render();
    });

    document.getElementById("next").addEventListener("click", () => {
        month++;
        if (month > 11) {
            month = 0;
            year++;
        }
        render();
    });

    document.getElementById("clear").addEventListener("click", () => {
        selectedDays.clear();
        render();
    });

    render();
})();
</script>
</body>
</html>
